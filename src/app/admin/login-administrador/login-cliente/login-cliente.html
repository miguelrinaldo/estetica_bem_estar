<div id="div-form">
    <form id="login_cliente">
     <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informar seu nome">

        
        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" class="input02" required maxlength="80" placeholder="Informar seu cpf">

         <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="btnSelecao" value="M"> Masculino

        <input type="radio" name="sexoF" id="sexoF" class="btnSelecao" value="F"> Feminino

        <input type="radio" name="sexo"  id="sexoN" class="btnSelecao" value="N"> Não sei identificar

           <label for="data_nascimento">Data de Nascimento</label>
        <input type="date" name="data_nascimento" id="data_nascimento" >

        <div id="div-btns">
            <button type="submit" id="btnAdd">Cadastrar Cliente</button>
            <button type="reset" id="btnLimpar">Excluir Cadastro</button>

        </div>


    </form>


</div>
