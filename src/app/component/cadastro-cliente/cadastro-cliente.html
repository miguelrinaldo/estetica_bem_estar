<div>
    <h2>Cadastro Cliente</h2>


    <form id="form-cliente" >
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome">
        
        <label for="cpf">Cpf</label>
        <input type="text" name="cpf" id="cpf" class="input02" required maxlength="100" placeholder="Informe seu cpf">

        <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="btnSelecao" value="M"> Masculino
        <input type="radio" name="sexo" id="sexoF" class="btnSelecao" value="F"> Feminino
        <input type="radio" name="sexo" id="sexoN" class="btnSelecao" value="N"> Não sei identificar

        <label for="data_nascimento">Data de nascimento</label>
        <input type="date" name="data_nascimento" id="data_nascimento" >

        <label for="email">Email</label>
        <input type="text" name="email" id="email" class="input02" required maxlength="100" placeholder="Informe seu email">

        <label for="telefone">Telefone</label>
        <input type="number" name="telefone" id="telefone" class="input02" required maxlength="100" placeholder="Informe seu número">
    </form>





</div>
